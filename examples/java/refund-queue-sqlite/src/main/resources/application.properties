server.port=8080
spring.application.name=refund-queue

# SQLite 单写者队列（生产可换 PostgreSQL，并把 driver/url 改掉）
# 路径可用环境变量覆盖：REFUND_DB=/data/refund.db
spring.datasource.url=jdbc:sqlite:${REFUND_DB:refund.db}?journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC

# 单写者：连接池只留 1 个连接，保证写串行（抢任务原子性）
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# 消费者轮询间隔（毫秒），对应 RefundTaskService.poll 的 fixedDelay
refund.poll.interval-ms=30000

logging.level.com.yuying.refund=INFO
