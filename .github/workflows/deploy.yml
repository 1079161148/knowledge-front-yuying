name: Deploy to all platforms

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # 统一构建命令，供各平台复用（与 package.json 的 build:site 一致）
  BUILD_CMD: "npm ci && npm run vendor:sync && mkdocs build --strict"
  SITE_DIR: site

jobs:
  # ---------- 统一构建：只构建一次产物 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-material" "pymdown-extensions" "mkdocs-minify-plugin"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site (统一命令)
        run: npm run build:site

      - name: Upload Pages artifact (自动展开 symlink)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Upload generic artifact for other platforms
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ${{ env.SITE_DIR }}
          if-no-files-found: error

  # ---------- 1. GitHub Pages ----------
  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------- 2. Cloudflare Pages ----------
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CF_PROJECT_NAME: ${{ secrets.CF_PROJECT_NAME }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.SITE_DIR }}
      - name: Check required secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CF_PROJECT_NAME" ]; then
            echo "::error::缺少 Cloudflare Secret，请在仓库 Settings → Secrets 配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CF_PROJECT_NAME"; exit 1
          fi
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy ${{ env.SITE_DIR }} --project-name="$CF_PROJECT_NAME" --commit-dirty=true

  # ---------- 3. Vercel ----------
  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.SITE_DIR }}
      - name: Check required secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::缺少 Vercel Secret，请在仓库 Settings → Secrets 配置 VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID"; exit 1
          fi
      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy ${{ env.SITE_DIR }} --prod --token="$VERCEL_TOKEN" --yes

  # ---------- 4. Netlify ----------
  deploy-netlify:
    needs: build
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_SITE_NAME: ${{ secrets.NETLIFY_SITE_NAME || 'knowledge-front-yuying' }}
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.SITE_DIR }}
      - name: Check required secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::缺少 Netlify Secret，请在仓库 Settings → Secrets 配置 NETLIFY_AUTH_TOKEN（个人访问令牌，无需预先建站点）"; exit 1
          fi
      - name: Ensure site exists
        id: site
        run: |
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "未配置 NETLIFY_SITE_ID，尝试自动创建站点（名称: $NETLIFY_SITE_NAME）..."
            OUT=$(npx --yes netlify-cli@latest sites:create --disable-link --name "$NETLIFY_SITE_NAME" --auth="$NETLIFY_AUTH_TOKEN" --json 2>/dev/null)
            SITE=$(printf '%s' "$OUT" | grep -oE '"id":[[:space:]]*"[^"]+"' | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')
            if [ -z "$SITE" ]; then
              echo "::error::自动创建 Netlify 站点失败，请在 Netlify 后台手动建站并配置 NETLIFY_SITE_ID"; exit 1
            fi
            echo "site_id=$SITE" >> "$GITHUB_OUTPUT"
            echo "已创建站点，ID=$SITE（建议将其保存为仓库 Secret NETLIFY_SITE_ID 以免重复建站）"
          else
            echo "site_id=$NETLIFY_SITE_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@latest deploy --prod --dir=${{ env.SITE_DIR }} --auth="$NETLIFY_AUTH_TOKEN" --site="${{ steps.site.outputs.site_id }}"
