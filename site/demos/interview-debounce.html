<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手写防抖 Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d161d; color: #e0f7fa; padding: 1rem; margin: 0; }
    input { padding: .4rem; font-size: 1rem; border-radius: 6px; border: none; width: 100%; box-sizing: border-box; }
    #log { margin-top: .6rem; background: #203a43; border-radius: 6px; padding: .6rem; min-height: 70px; white-space: pre-wrap; line-height: 1.5; }
    button { margin-top: .5rem; padding: .3rem .8rem; border: none; border-radius: 6px; background: #2c5364; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h4>手写防抖（debounce）演示</h4>
  <input id="inp" placeholder="快速连续输入，停止 500ms 后才触发" />
  <div id="log">日志：</div>
  <button onclick="clearLog()">清空</button>

  <script>
    function debounce(fn, wait) {
      let t
      return function (...args) {
        clearTimeout(t)
        t = setTimeout(() => fn.apply(this, args), wait)
      }
    }
    const log = document.getElementById('log')
    const debounced = debounce((v) => { log.textContent += '\n触发: ' + v }, 500)
    document.getElementById('inp').addEventListener('input', e => debounced(e.target.value))
    function clearLog() { log.textContent = '日志：' }
  </script>
</body>
</html>
