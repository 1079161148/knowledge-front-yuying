site_name: 鱼樱互联网知识库
site_description: 鱼樱互联网知识库：HTML/CSS/JS/TS核心术语、框架对比、工程化、AI前端全栈知识体系
site_author: lhl
site_url: https://1079161148.github.io/knowledge-front-yuying/
repo_url: https://github.com/1079161148/knowledge-front-yuying
copyright: 鱼樱互联网知识库
edit_uri: edit/master/
docs_dir: docs

theme:
  name: material
  language: zh
  logo: assets/logo-yuying.svg
  favicon: assets/logo-yuying.svg
  custom_dir: docs/overrides
  palette:
    # 深色科技风（默认）
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色
    # 浅色（可切换）
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至深色
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  font: false

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/vendor/mermaid.min.js
  - assets/mermaid-init.js
  - assets/mermaid-render.js

