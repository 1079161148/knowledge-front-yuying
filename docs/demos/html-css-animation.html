<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 动画 Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #e0f7fa; background: #0d161d; padding: 1rem; text-align: center; margin: 0; }
    .box { width: 80px; height: 80px; margin: 1rem auto; background: linear-gradient(135deg, #00e5ff, #7c4dff); border-radius: 12px; animation: spin 2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { padding: .4rem 1rem; border: none; border-radius: 6px; background: #203a43; color: #fff; cursor: pointer; transition: transform .2s, background .2s; }
    .btn:hover { transform: scale(1.08); background: #2c5364; }
  </style>
</head>
<body>
  <h4>@keyframes 旋转动画</h4>
  <div class="box"></div>
  <h4>transition 悬停过渡</h4>
  <button class="btn">Hover 我</button>
</body>
</html>
