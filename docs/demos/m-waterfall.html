<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>移动端实战 · 双列瀑布流</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; }
  .wrap { padding: 16px 12px calc(16px + env(safe-area-inset-bottom)); }
  h3 { font-size: 15px; margin: 4px 0; }
  .tip { font-size: 12px; color: #8b949e; margin-bottom: 12px; line-height: 1.5; }
  .flow { display: flex; gap: 8px; align-items: flex-start; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .card { background: linear-gradient(135deg, #1f6feb33, #3fb95022); border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .card .ph { display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .card .meta { padding: 6px 8px; font-size: 12px; color: #c9d1d9; }
  #status { text-align: center; font-size: 12px; color: #e3b341; margin-top: 10px; }
  .skeleton { background: #21262d; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <h3>双列瀑布流（小红书式）</h3>
  <div class="tip">真实难点：① 用两列容器"哪列矮插哪列"（绝对定位法更精准但复杂）；② 图片高度未知导致插列错位 → 需先获知宽高比；③ 触底加载 + loading 锁；④ iOS 上 100vh 视口坑用 dvh。</div>
  <div class="flow">
    <div class="col" id="c0"></div>
    <div class="col" id="c1"></div>
  </div>
  <div id="status">下拉到底加载更多…</div>
</div>
<script>
const c0 = document.getElementById('c0'), c1 = document.getElementById('c1');
const status = document.getElementById('status');
let page = 0, loading = false, done = false;
function card(i) {
  const h = 120 + (i*53) % 180;
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<div class="ph skeleton" style="height:${h}px">图 ${i}</div><div class="meta">笔记 ${i} · ${(i*9%999)+20}赞</div>`;
  return el;
}
function load() {
  if (loading || done) return; loading = true; status.textContent = '加载中…';
  setTimeout(() => {
    const frag0 = document.createDocumentFragment(), frag1 = document.createDocumentFragment();
    for (let k = 0; k < 8; k++) { const i = page*8+k; (i%2 ? frag1 : frag0).appendChild(card(i)); }
    c0.appendChild(frag0); c1.appendChild(frag1);
    page++; loading = false;
    if (page >= 6) { done = true; status.textContent = `已加载 ${page*8} 条`; }
    else status.textContent = `已加载 ${page*8} 条`;
  }, 500);
}
const sentinel = document.createElement('div'); sentinel.style.height='1px'; document.querySelector('.wrap').appendChild(sentinel);
new IntersectionObserver(es => { if (es[0].isIntersecting) load(); }, { rootMargin: '250px' }).observe(sentinel);
load();
</script>
</body>
</html>
