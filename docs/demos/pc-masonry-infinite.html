<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 实战 · 瀑布流无限滚动</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0d1117; color: #e6edf3; }
  .wrap { padding: 16px; }
  h3 { margin: 0 0 4px; font-size: 15px; }
  .tip { font-size: 12px; color: #8b949e; margin-bottom: 10px; }
  .masonry { column-count: 4; column-gap: 12px; }
  .item { break-inside: avoid; margin-bottom: 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .item .ph { background: linear-gradient(135deg, #1f6feb55, #3fb95055); display: flex; align-items: center; justify-content: center; color: #e6edf3; font-size: 20px; }
  .item .meta { padding: 8px 10px; font-size: 12px; color: #8b949e; }
  .item .meta b { color: #e6edf3; }
  #status { margin-top: 10px; font-size: 12px; color: #e3b341; }
  .skeleton { background: #21262d; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <h3>瀑布流无限滚动（仿图片墙 / 商品流）</h3>
  <div class="tip">真实难点：① 绝对定位布局 vs CSS columns 的取舍；② 图片未加载时高度未知导致回流抖动；③ 触底加载用 IntersectionObserver 比 scroll 监听更稳；④ 高频触底要加 loading 锁防并发。</div>
  <div class="masonry" id="masonry"></div>
  <div id="status">下拉到底自动加载…</div>
</div>
<script>
const colors = ['#1f6feb','#3fb950','#f85149','#d29922','#a371f7','#db61a2'];
const masonry = document.getElementById('masonry');
const status = document.getElementById('status');
let page = 0, loading = false, done = false;
function makeCard(i) {
  const h = 120 + (i * 37) % 220; // 模拟不等高
  const c = colors[i % colors.length];
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<div class="ph skeleton" style="height:${h}px;background:${c}33">#${i}</div>
    <div class="meta"><b>商品 ${i}</b><br>￥${(i*13%900)+9} · ${(i*7%500)+20}人想要</div>`;
  return el;
}
function load() {
  if (loading || done) return;
  loading = true; status.textContent = '加载中…';
  // 模拟接口延迟
  setTimeout(() => {
    const frag = document.createDocumentFragment();
    for (let k = 0; k < 12; k++) frag.appendChild(makeCard(page * 12 + k));
    masonry.appendChild(frag);
    page++;
    loading = false;
    if (page >= 8) { done = true; status.textContent = `已加载全部 ${page*12} 条`; }
    else status.textContent = `已加载 ${page*12} 条，继续下拉…`;
  }, 600);
}
// 触底哨兵：用 IntersectionObserver 监听底部，比 scroll 高频计算优雅
const sentinel = document.createElement('div');
sentinel.style.height = '1px';
document.querySelector('.wrap').appendChild(sentinel);
const io = new IntersectionObserver(entries => { if (entries[0].isIntersecting) load(); }, { rootMargin: '300px' });
io.observe(sentinel);
load();
</script>
</body>
</html>
